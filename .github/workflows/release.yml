name: Release

# Phase 4 of PLAN_API_CI.md. Publishes Linux binaries for every
# `vX.Y.Z` tag. It never packages the ROM: the package only carries the
# executable, the documentation, and a RUN.md explaining where to place the
# user's own ROM.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------
  # Linux (gcc). Same dependency/configure steps as the `linux` job in
  # ci.yml; see that file for the details of each package.
  # ---------------------------------------------------------------------
  build-linux:
    name: Build Linux package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libsdl2-dev libcurl4-openssl-dev \
            libgles2-mesa-dev libegl1-mesa-dev libgl1-mesa-dri \
            libgl-dev xvfb

      - name: Extract GBRT_REF
        id: gbrt
        run: |
          ref=$(sed -n 's/.*set(GBRT_REF "\([^"]*\)".*/\1/p' CMakeLists.txt)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Cache FetchContent deps (gb-recompiled)
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ${{ runner.os }}-release-deps-${{ steps.gbrt.outputs.ref }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DPOKEYELLOW_3D=ON \
            -DCMAKE_BUILD_TYPE=MinSizeRel

      - name: Build
        run: cmake --build build --parallel

      - name: Sanity test (ctest -LE rom)
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a ctest --test-dir build -LE rom --output-on-failure --output-junit "$PWD/build/ctest.xml"

      - name: Require software rendering coverage
        run: |
          python3 - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root = ET.parse("build/ctest.xml").getroot()
          preview = root.find(".//testcase[@name='render_preview_synthetic']")
          assert preview is not None and preview.find("skipped") is None, "Renderer test must run, not skip"
          output = preview.findtext("system-out", "").lower()
          assert "llvmpipe" in output or "softpipe" in output, "Renderer must run on software Mesa"
          PYCODE

      - name: Package
        run: |
          set -eu
          pkg="pokeyellow3d-linux-x86_64-${{ github.ref_name }}"
          mkdir -p "dist/$pkg"
          cp build/pokeyellow3d "dist/$pkg/"
          cp PALLET3D.md README.md "dist/$pkg/"
          ldd build/pokeyellow3d > "dist/$pkg/DEPENDENCIES.txt"
          if grep -q 'not found' "dist/$pkg/DEPENDENCIES.txt"; then
            cat "dist/$pkg/DEPENDENCIES.txt"
            exit 1
          fi
          cat > "dist/$pkg/RUN.md" <<'EOF'
          # Running pokeyellow3d

          This Linux x86_64 binary is built on Ubuntu 24.04. It requires
          compatible system libraries: SDL2, libcurl, OpenGL/GLES2, and a
          graphics driver. DEPENDENCIES.txt records the linked libraries.
          This is a dynamic binary, not a self-contained AppImage.

          This package does not include the Pokemon Yellow ROM. Supply your
          own copy:

          1. Create a `roms` folder next to the `pokeyellow3d` executable
             in the extracted package.
          2. Copy your ROM into it as `roms/pokeyellow.gbc`. The build
             targets the 1 MiB English USA/Europe ROM, SHA-1
             `cc7d03262ebfaf2f06772c1a480c7d9d5f4a38e1`.
          3. Open a terminal in this folder and run `./pokeyellow3d`.

          On first launch the game extracts its assets into an `assets/`
          folder next to the executable; later launches reuse them. Saves
          are written to `pokeyellow.sav` in the same folder. See
          `PALLET3D.md` and `README.md` for controls and troubleshooting.
          EOF
          cd dist && zip -r "${pkg}.zip" "$pkg"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pokeyellow3d-linux
          path: dist/*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Windows (MSVC). Same steps as the `windows` job in ci.yml.
  # ---------------------------------------------------------------------
  # build-windows is intentionally absent: the pinned gb-recompiled runtime
  # does not compile with MSVC yet (see the Windows job in ci.yml). Restore
  # it once the runtime is portable.

  publish:
    name: Publish release
    needs: [build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
