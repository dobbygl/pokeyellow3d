name: CI

# Phase 4 of PLAN_API_CI.md. Builds and tests on every push to main and on
# every pull request. It never uses or contains the ROM in any step: tests
# tagged `rom` (registered only when build/roms/pokeyellow.gbc exists
# locally) are excluded with `ctest -LE rom`.

on:
  push:
    branches: [main]
  pull_request:

# Cancels stale runs of the same branch/PR when new commits arrive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # bash also on windows-2022 (Git Bash comes preinstalled on the
    # runner), so the same `sed`/environment-variable syntax works for
    # all three operating systems.
    shell: bash

jobs:
  # ---------------------------------------------------------------------
  # Linux: GCC / Clang matrix, full 3D build + ctest without the ROM.
  # ---------------------------------------------------------------------
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Packages requested by PLAN_API_CI.md: ninja-build libsdl2-dev
          # libcurl4-openssl-dev libgles2-mesa-dev libegl1-mesa-dev
          # libgl1-mesa-dri xvfb.
          #
          # libgles2-mesa-dev / libegl1-mesa-dev are the transitional
          # package names on 24.04 (the successors are libgles-dev /
          # libegl-dev). If Ubuntu drops them, this step is the first
          # thing to fix. They provide <GLES2/gl2.h>, which
          # runtime/vendor/imgui/backends/imgui_impl_opengl3.cpp includes
          # directly when built with IMGUI_IMPL_OPENGL_ES2 (which is how
          # cmake/Pallet3D.cmake builds it on every platform).
          # libgl1-mesa-dri provides the software rasterizer (llvmpipe)
          # used by the headless GL context on the runner.
          #
          # libgl-dev and ccache are NOT in the plan's literal list; they
          # are added here because runtime/CMakeLists.txt links `-lGL`
          # directly when find_package(OpenGL) fails to resolve the
          # OpenGL::GL target (Linux branch, neither APPLE nor WIN32), and
          # only libgl-dev (or the older libgl1-mesa-dev) provides the
          # unversioned libGL.so symlink and the GL/gl.h headers that
          # FindOpenGL.cmake looks for; without it, linking the executable
          # fails. ccache is needed as a binary for the build cache
          # requested by the plan.
          sudo apt-get install -y --no-install-recommends \
            ninja-build libsdl2-dev libcurl4-openssl-dev \
            libgles2-mesa-dev libegl1-mesa-dev libgl1-mesa-dri \
            libgl-dev xvfb ccache

      - name: Extract GBRT_REF
        id: gbrt
        run: |
          ref=$(sed -n 's/.*set(GBRT_REF "\([0-9a-f]*\)".*/\1/p' CMakeLists.txt)
          if [ -z "$ref" ]; then
            echo "::error::Could not extract GBRT_REF from CMakeLists.txt" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Cache FetchContent deps (gb-recompiled)
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ${{ runner.os }}-${{ matrix.compiler }}-deps-${{ steps.gbrt.outputs.ref }}

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-${{ matrix.compiler }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-ccache-

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DPOKEYELLOW_3D=ON \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Test (ctest -LE rom)
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          # Phase 4 decision (documented in PLAN_API_CI.md, decision 6-7):
          # SDL_VIDEODRIVER=offscreen is the driver chosen because it's the
          # one tests/pallet_render_smoke.cpp already uses locally to open
          # a real headless GL context (see "Verified starting point" in
          # PLAN_API_CI.md). With SDL_VIDEODRIVER fixed, SDL does NOT retry
          # with another driver if offscreen fails: it just returns an
          # error. `xvfb-run -a` doesn't change that or act as a
          # driver-level fallback; its real, narrower value is guaranteeing
          # a $DISPLAY (cost ~1s) for any Mesa, ImGui, or SDL code path
          # that assumes one exists, even though the active driver stays
          # offscreen. LIBGL_ALWAYS_SOFTWARE forces llvmpipe in case the
          # runner exposes a DRI device that Mesa tries before the
          # software renderer.
          xvfb-run -a ctest --test-dir build -LE rom --output-on-failure

  # ---------------------------------------------------------------------
  # Linux: build with the 3D layer disabled, so the original 2D
  # executable does not break. It registers no tests (enable_testing()/
  # add_test() live inside the if(POKEYELLOW_3D) block of CMakeLists.txt),
  # so this job only validates the build.
  # ---------------------------------------------------------------------
  linux-2d:
    name: Linux (2D, POKEYELLOW_3D=OFF)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libsdl2-dev libcurl4-openssl-dev ccache

      - name: Extract GBRT_REF
        id: gbrt
        run: |
          ref=$(sed -n 's/.*set(GBRT_REF "\([0-9a-f]*\)".*/\1/p' CMakeLists.txt)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Cache FetchContent deps (gb-recompiled)
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ${{ runner.os }}-2d-deps-${{ steps.gbrt.outputs.ref }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DPOKEYELLOW_3D=OFF \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

  # ---------------------------------------------------------------------
  # Windows: MSVC + Ninja, dependencies via the vcpkg preinstalled on the
  # runner (classic mode, no vcpkg.json).
  # ---------------------------------------------------------------------
  # Windows is a non-blocking canary until the pinned gb-recompiled revision
  # is portable: its runtime includes <pthread.h> and <arpa/inet.h>
  # unconditionally (serial_link.c, network_discovery.c) and platform_sdl.cpp
  # uses C++20 designated initializers while this project pins C++17. Both
  # are upstream matters (see PLAN_API_CI.md, phase 5); the job stays so a
  # future runtime bump is checked automatically.
  # Disabled for now (if: false): remove that line to re-enable the job.
  windows:
    name: Windows (MSVC, disabled)
    if: false
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies via vcpkg
        run: |
          # sdl2 and curl are the ones requested by the plan. opengl-registry
          # is added because runtime/vendor/imgui/backends/imgui_impl_opengl3.cpp
          # includes <GLES2/gl2.h> directly when built with
          # IMGUI_IMPL_OPENGL_ES2 (see the Linux job comment); that header
          # comes from neither sdl2 nor curl. RISK not verifiable without
          # running Actions: it has not been confirmed on a real runner
          # that opengl-registry:x64-windows is enough (it only provides
          # Khronos headers; linking is still against the Windows SDK's
          # opengl32.lib, same as in runtime/CMakeLists.txt). If the job
          # fails to build over a missing GLES2/EGL header, that is the
          # first place to look.
          vcpkg install sdl2:x64-windows curl:x64-windows opengl-registry:x64-windows
          echo "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"

      - name: Extract GBRT_REF
        id: gbrt
        run: |
          ref=$(sed -n 's/.*set(GBRT_REF "\([0-9a-f]*\)".*/\1/p' CMakeLists.txt)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Cache FetchContent deps (gb-recompiled)
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ${{ runner.os }}-msvc-deps-${{ steps.gbrt.outputs.ref }}

      - name: Set up sccache
        # sccache-action installs the binary and, with SCCACHE_GHA_ENABLED,
        # uses GitHub Actions' own cache as its backend, without needing a
        # separate actions/cache step for its local directory.
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows \
            -DPOKEYELLOW_3D=ON \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: cmake --build build --parallel

      - name: Test (ctest -LE rom)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build -LE rom --output-on-failure

  # ---------------------------------------------------------------------
  # macOS: non-blocking. See PLAN_API_CI.md ("macOS depends on the
  # runtime offering a compatible GL backend; until that is confirmed,
  # it does not block"). Concrete evidence found while preparing this
  # workflow: runtime/vendor/imgui/backends/imgui_impl_opengl3.cpp
  # includes <GLES2/gl2.h> with no Apple-desktop guard (it only excludes
  # iOS/tvOS), and neither the macOS SDK nor `brew install sdl2 curl`
  # provides that Khronos header (a `mesa` formula exists in
  # homebrew-core, but it pulls in X11 and LLVM and is not part of the
  # requested dependencies). This job is very likely to fail at the
  # build step; continue-on-error still lets the rest of the workflow
  # finish green.
  # ---------------------------------------------------------------------
  # Disabled for now (if: false): remove that line to re-enable the job.
  macos:
    name: macOS (disabled)
    if: false
    runs-on: macos-14
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (brew)
        run: brew install sdl2 curl ninja

      - name: Extract GBRT_REF
        id: gbrt
        run: |
          ref=$(sed -n 's/.*set(GBRT_REF "\([0-9a-f]*\)".*/\1/p' CMakeLists.txt)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Cache FetchContent deps (gb-recompiled)
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ${{ runner.os }}-deps-${{ steps.gbrt.outputs.ref }}

      - name: Configure
        run: |
          # macOS ships no Khronos GLES2 headers; SDL_USE_BUILTIN_OPENGL_DEFINITIONS
          # makes <SDL_opengles2.h> use the copies bundled with SDL instead.
          cmake -S . -B build -G Ninja \
            -DPOKEYELLOW_3D=ON \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_FLAGS="-DSDL_USE_BUILTIN_OPENGL_DEFINITIONS=1" \
            -DCMAKE_CXX_FLAGS="-DSDL_USE_BUILTIN_OPENGL_DEFINITIONS=1"

      - name: Build
        run: cmake --build build --parallel

      - name: Test (ctest -LE rom)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build -LE rom --output-on-failure

  # ---------------------------------------------------------------------
  # Format: commented out because there is no .clang-format in the
  # repository yet. Once one is added at the root, uncomment this job so
  # that src/ and tests/ pass `clang-format --dry-run --Werror`.
  # ---------------------------------------------------------------------
  # format:
  #   name: clang-format
  #   runs-on: ubuntu-24.04
  #   timeout-minutes: 10
  #   steps:
  #     - uses: actions/checkout@v7
  #     - name: Check formatting
  #       run: |
  #         find src tests \( -name '*.cpp' -o -name '*.h' -o -name '*.c' \) \
  #           | xargs clang-format --dry-run --Werror
